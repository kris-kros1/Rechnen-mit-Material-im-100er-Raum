<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hunderterfeld – Zehner & Einer</title>
<style>
:root{--bg:#f4f8fc;--card:#fff;--ink:#17324d;--muted:#64788b;--ten:#4d98df;--tenLight:#dceeff;--one:#3d9b59;--oneLight:#dff5e4;--ok:#35a853;--bad:#d95151;--shadow:0 8px 24px rgba(30,70,100,.11)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#edf6ff,#f9fbfd);color:var(--ink);min-height:100vh}.wrap{max-width:980px;margin:auto;padding:16px}.head,.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow)}.head{padding:17px 21px;display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{margin:0;font-size:clamp(24px,4vw,37px)}.head p{margin:4px 0 0;color:var(--muted);font-size:16px}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.pill{padding:9px 14px;border-radius:999px;font-weight:800}.ten{background:var(--tenLight);color:#1765a9}.one{background:var(--oneLight);color:#24763b}.card{padding:18px}.answerMode{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 16px}.answerMode button{border:2px solid #d7e1e9;border-radius:16px;padding:12px 18px;background:#fff;color:var(--ink);font:inherit;font-weight:850;cursor:pointer;min-height:48px}.answerMode button.active{background:#17324d;color:#fff;border-color:#17324d}.inputArea{display:none;max-width:430px;margin:4px auto 0;text-align:center}.inputArea.show{display:block}.answerInput{width:150px;max-width:60%;font:inherit;font-size:30px;font-weight:900;text-align:center;padding:10px 12px;border:3px solid #c9d8e4;border-radius:15px;color:var(--ink);background:#fff}.checkBtn{border:0;border-radius:14px;padding:12px 18px;margin-left:7px;background:#17324d;color:#fff;font:inherit;font-weight:850;cursor:pointer;min-height:48px}.boardWrap.hidden{display:none}.settings{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}.settings button,.actions button{border:0;border-radius:14px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;background:#eef3f7;color:var(--ink);min-height:44px}.settings button.active{outline:3px solid #a8bfd2;background:white}.task{text-align:center;padding:10px 8px 15px}.small{color:var(--muted);font-size:16px}.start{font-size:clamp(22px,4vw,34px);font-weight:850;margin:5px}.instruction{font-size:clamp(27px,5vw,46px);font-weight:900;margin:8px 0}.instruction.tenText{color:var(--ten)}.instruction.oneText{color:var(--one)}.hintline{font-size:17px;font-weight:700;color:var(--muted);min-height:24px}.boardWrap{max-width:650px;margin:0 auto}.board{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;user-select:none}.cell{aspect-ratio:1;border:2px solid #d7e1e9;border-radius:10px;background:#fff;color:#29465f;font-size:clamp(13px,2.6vw,21px);font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;min-width:0}.cell:hover{transform:translateY(-1px);border-color:#8ba9c1}.cell.startCell{outline:4px solid #34495e;outline-offset:-4px;background:#f0f3f5}.cell.correct{background:#d9f4df!important;border-color:var(--ok);color:#176b2b;transform:scale(1.05)}.cell.wrong{background:#ffe2e2!important;border-color:var(--bad);color:#9c2929}.cell.targetHint{box-shadow:inset 0 0 0 4px #f2c94c}.feedback{text-align:center;min-height:56px;padding:13px 4px 3px;font-size:20px;font-weight:850}.feedback.ok{color:#27823c}.feedback.bad{color:#b23a3a}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:8px}.actions .new{background:#17324d;color:#fff}.actions .help{background:#fff4cc;color:#725b00}.score{text-align:center;color:var(--muted);margin-top:13px;font-weight:700}.explain{margin:14px auto 0;max-width:650px;padding:12px 15px;border-radius:15px;background:#f5f8fa;color:#40596e;display:none;font-size:17px;line-height:1.4}.explain.show{display:block}@media(max-width:560px){.wrap{padding:9px}.head{border-radius:18px;padding:13px 15px}.head p{font-size:14px}.card{border-radius:18px;padding:12px 8px}.board{gap:3px}.cell{border-radius:6px;border-width:1.5px}.legend{margin:9px 0}.pill{padding:7px 10px}.task{padding-top:4px}.instruction{margin:4px 0}.settings button{padding:9px 11px}}

/* iPad: komplette Übung ohne Scrollen sichtbar */
@media (min-width:700px) and (max-height:900px){
  body{min-height:0;overflow:hidden}
  .wrap{max-width:1024px;padding:7px 12px}
  .head{padding:7px 15px;border-radius:16px;min-height:52px}
  .head h1{font-size:25px;line-height:1.05}
  .head p{font-size:13px;margin-top:2px}
  .head>div:last-child{font-size:29px!important}
  .legend{position:absolute;top:13px;left:50%;transform:translateX(-50%);margin:0;gap:6px}
  .pill{padding:5px 10px;font-size:13px}
  .card{margin-top:7px;padding:7px 12px 8px;border-radius:18px}
  .answerMode{margin:0 0 5px;gap:6px}
  .answerMode button{padding:6px 13px;min-height:34px;border-radius:11px;font-size:14px}
  .settings{margin-bottom:4px;gap:6px}
  .settings button,.actions button{padding:5px 11px;min-height:33px;border-radius:10px;font-size:14px}
  .settings button.active{outline-width:2px}
  .task{padding:1px 4px 3px}
  .small{font-size:12px;line-height:1}
  .start{font-size:23px;margin:1px}
  .instruction{font-size:29px;line-height:1;margin:1px 0 2px}
  .hintline{font-size:13px;min-height:16px;line-height:1.15}
  .boardWrap{max-width:370px}
  .board{gap:2px}
  .cell{border-width:1px;border-radius:5px;font-size:13px}
  .cell.startCell{outline-width:3px;outline-offset:-3px}
  .feedback{min-height:27px;padding:4px 2px 0;font-size:15px;line-height:1.15}
  .actions{margin-top:3px;gap:6px}
  .score{margin-top:4px;font-size:12px;line-height:1}
  .explain{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:8px;width:min(620px,90%);margin:0;padding:8px 12px;font-size:14px;line-height:1.25;box-shadow:0 5px 18px rgba(30,70,100,.18)}
  .inputArea{margin:4px auto 2px}
  .answerInput{font-size:25px;padding:6px 10px}
  .checkBtn{padding:7px 15px;min-height:38px}
}
@media (min-width:700px) and (max-height:760px){
  .head{min-height:46px;padding:5px 14px}.head h1{font-size:22px}.head p{font-size:12px}
  .legend{top:10px}.pill{padding:4px 9px}
  .card{margin-top:5px;padding-top:5px}
  .answerMode{margin-bottom:3px}.settings{margin-bottom:2px}
  .answerMode button,.settings button,.actions button{min-height:30px;padding-top:4px;padding-bottom:4px}
  .start{font-size:20px}.instruction{font-size:25px}.hintline{font-size:12px;min-height:14px}
  .boardWrap{max-width:335px}.cell{font-size:12px}
  .feedback{min-height:23px;font-size:14px;padding-top:2px}.actions{margin-top:2px}.score{margin-top:3px}
}
<style>
.materialArea{max-width:740px;margin:auto}.materialTip{text-align:center;color:var(--muted);font-size:14px;margin:3px 0 7px}.materialMat{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:180px}.materialGroup{border:2px solid #e1eaf1;border-radius:16px;padding:9px;background:#f9fbfd;min-width:0}.materialLabel{text-align:center;font-weight:850;margin-bottom:7px}.pieces{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;justify-content:center}.rod,.cube{border:2px solid transparent;cursor:pointer;touch-action:manipulation;position:relative;flex-shrink:0}.rod{width:24px;height:102px;border-radius:5px;background:repeating-linear-gradient(to bottom,#3785cd 0,#3785cd 8px,#91c8f2 8px,#91c8f2 10px);border-color:#236fae;box-shadow:1px 2px 2px #0002}.cube{width:26px;height:26px;border-radius:5px;background:#48b86b;border-color:#25854a;box-shadow:inset -4px -4px 0 #26924b}.rod:focus-visible,.cube:focus-visible{outline:3px solid #e6a400}.materialTools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:9px}.materialTools button{min-height:42px;padding:7px 13px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer;background:#e9eff5;color:#17324d}.materialTools .addTen{background:var(--tenLight);color:#145c9d}.materialTools .addOne{background:var(--oneLight);color:#206d38}.materialTools .checkMat{background:#17324d;color:#fff}.materialTools button:disabled{opacity:.4;cursor:not-allowed}
.materialAnswer{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-weight:750}.materialAnswerRow{display:flex;gap:7px;align-items:center}.materialAnswer input{width:115px;max-width:32vw;padding:8px;border:2px solid #9fb5c6;border-radius:10px;font:inherit;font-size:17px;text-align:center;background:white;color:#17324d}.materialAnswer button{border:0;border-radius:10px;padding:9px 12px;background:#17324d;color:white;font:inherit;font-weight:800;cursor:pointer;min-height:40px}.materialAnswer button:disabled{opacity:.45}.materialAnswer input:disabled{opacity:.6}@media(max-width:560px){.materialAnswer{gap:5px;font-size:13px}.materialAnswer input{width:96px}.materialAnswer button{font-size:13px;padding:8px}}
@media(min-width:700px) and (max-height:900px){.materialMat{min-height:130px}.rod{height:82px;width:21px}.cube{width:22px;height:22px}.materialGroup{padding:5px}.materialLabel{margin-bottom:4px;font-size:13px}.materialTip{font-size:12px;margin:1px 0 4px}.materialTools{margin-top:5px;gap:5px}.materialTools button{min-height:32px;padding:4px 9px;font-size:13px}.pieces{gap:3px}}
@media(max-width:560px){.materialMat{gap:5px}.materialGroup{padding:5px}.rod{width:20px;height:85px}.cube{width:23px;height:23px}.materialTools button{font-size:13px;padding:7px 9px}}
</style><style>
body{background:#f4f7fa}
.wrap{max-width:900px;padding:7px 10px}
.card{padding:9px 14px;border-radius:20px}
.settings,.answerMode{margin-bottom:6px}
.task{padding:2px 6px 5px}
.start,.instruction{font-size:clamp(34px,5vw,48px)!important}
.materialMat{min-height:140px}
.materialTools button{font-size:18px;font-weight:900;min-height:44px}
.feedback{min-height:32px;padding:5px 4px 0}
.actions{margin-top:4px}
.score{margin-top:5px}
@media(min-width:700px) and (max-height:900px){
.wrap{padding:4px 8px}.card{padding:5px 10px}.settings button,.answerMode button{min-height:32px;padding:4px 9px;font-size:13px}
.task{padding:0 5px 3px}.start,.instruction{font-size:34px!important}.materialMat{min-height:112px}
.materialTools button{min-height:33px;padding:3px 9px;font-size:15px}.feedback{min-height:24px;font-size:16px;padding:2px}
.actions button{min-height:33px;padding:4px 11px}.score{font-size:12px;margin-top:2px}
}
</style></head>
<body><div class="wrap">


<div class="card">
<div class="answerMode" aria-label="Antwortart"><button data-answer="input">⌨️ Zahl</button><button data-answer="material" class="active">🧩 Material</button></div>
<div class="settings" aria-label="Aufgabenauswahl"><button data-mode="mix" class="active">🎲 Alle</button><button data-mode="ten">Zehner</button><button data-mode="one">Einer</button><button data-mode="plus">＋</button><button data-mode="minus">−</button></div>
<div class="task"><div id="startText" class="start">34</div><div id="instruction" class="instruction tenText">+ 2 Zehner</div><div id="hintline" class="hintline">Tippe die neue Zahl im Hunderterfeld an.</div></div>
<div id="inputArea" class="inputArea"><input id="answerInput" class="answerInput" type="number" min="1" max="100" inputmode="numeric" aria-label="Ergebnis"><button id="check" class="checkBtn">Prüfen</button></div>
<div id="materialArea" class="materialArea">

<div class="materialMat"><div class="materialGroup"><div class="materialLabel">🔵 Zehner</div><div id="tens" class="pieces"></div></div><div class="materialGroup"><div class="materialLabel">🟢 Einer</div><div id="ones" class="pieces"></div></div></div>
<div class="materialAnswer"><label for="materialNumber">Welche neue Zahl hast du gelegt?</label><div class="materialAnswerRow"><input id="materialNumber" type="number" inputmode="numeric" min="1" max="100" placeholder="Neue Zahl" aria-label="Neue Zahl eingeben"><button id="checkMaterialNumber" type="button">✓ Zahl prüfen</button></div></div>
<div class="materialTools"><button id="addTen" type="button" class="addTen">＋ 🔵</button><button id="addOne" type="button" class="addOne">＋ 🟢</button><button id="exchangeTen" type="button" class="addTen">🔵 → 10 🟢</button><button id="resetMat" type="button">↺</button><button id="checkMat" type="button" class="checkMat">✓</button></div>
</div>
<div id="feedback" class="feedback" aria-live="polite"></div>
<div class="actions"><button id="new" class="new">Neue Aufgabe</button></div>
<div id="score" class="score">Richtig: 0 · Aufgaben: 0</div>
</div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const startText=$('startText'),instruction=$('instruction'),feedback=$('feedback'),explain=$('explain'),score=$('score'),answerInput=$('answerInput'),hintline=$('hintline');
let mode='mix',answerMode='material',start=34,target=54,kind='ten',sign=1,amount=2,locked=false,right=0,total=0,tens=3,ones=4;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function showFeedback(msg,ok=false){feedback.textContent=msg;feedback.className='feedback '+(ok?'ok':'bad')}
let exchanged=false;
function draw(){
if(!exchanged&&ones>=10){tens+=Math.floor(ones/10);ones=ones%10}
const ts=$('tens'),os=$('ones');ts.replaceChildren();os.replaceChildren();
for(let i=0;i<tens;i++){const b=document.createElement('button');b.type='button';b.className='rod';b.title='Zehnerstange wegnehmen';b.setAttribute('aria-label','Eine Zehnerstange wegnehmen');b.disabled=locked;b.onclick=()=>{if(tens>0){tens--;draw()}};ts.append(b)}
for(let i=0;i<ones;i++){const b=document.createElement('button');b.type='button';b.className='cube';b.title='Einerwürfel wegnehmen';b.setAttribute('aria-label','Einen Einerwürfel wegnehmen');b.disabled=locked;b.onclick=()=>{if(ones>0){ones--;if(ones<10)exchanged=false;draw()}};os.append(b)}
$('addTen').disabled=locked||tens>=10||tens*10+ones+10>100;
$('addOne').disabled=locked||tens*10+ones>=100;
$('exchangeTen').disabled=locked||tens===0;$('checkMat').disabled=locked;$('checkMaterialNumber').disabled=locked;$('materialNumber').disabled=locked;
}
function resetMaterial(){exchanged=false;tens=Math.floor(start/10);ones=start%10;draw()}
function make(){
locked=false;feedback.textContent='';feedback.className='feedback';explain.className='explain';explain.textContent='';answerInput.value='';$('materialNumber').value='';
let tries=0;
do{tries++;kind=mode==='ten'?'ten':mode==='one'?'one':Math.random()<.5?'ten':'one';sign=mode==='plus'?1:mode==='minus'?-1:Math.random()<.5?1:-1;amount=kind==='ten'?rnd(1,4):rnd(1,9);start=rnd(10,95);target=start+sign*(kind==='ten'?amount*10:amount)}
while((target<1||target>100|| false)&&tries<1000);
startText.textContent=start;instruction.textContent=(sign>0?'+ ':'− ')+amount+' '+(kind==='ten'?'Zehner':'Einer');instruction.className='instruction '+(kind==='ten'?'tenText':'oneText');resetMaterial();
}
function finish(n){if(locked)return;total++;if(n===target){right++;locked=true;showFeedback('✓ Richtig! '+start+(sign>0?' + ':' − ')+(kind==='ten'?amount*10:amount)+' = '+target,true);draw()}else showFeedback('✗ Noch einmal');
score.textContent='Richtig: '+right+' · Versuche: '+total}
function checkInput(){const v=answerInput.value.trim();if(!v){showFeedback('✗');return}const n=Number(v);if(!Number.isInteger(n)||n<1||n>100){showFeedback('✗');return}finish(n)}
function setAnswerMode(next){answerMode=next;document.querySelectorAll('.answerMode button').forEach(b=>b.classList.toggle('active',b.dataset.answer===next));$('inputArea').classList.toggle('show',next==='input');$('materialArea').style.display=next==='material'?'block':'none';hintline.textContent=next==='input'?'Tippe das Ergebnis ein.':'Lege Zehnerstangen oder Einerwürfel dazu oder nimm sie weg.';make()}
$('addTen').onclick=()=>{if(!locked&&tens*10+ones+10<=100){tens++;draw()}};
$('addOne').onclick=()=>{if(!locked&&tens*10+ones<100){ones++;exchanged=false;draw()}};
$('exchangeTen').onclick=()=>{if(!locked&&tens>0){tens--;ones+=10;exchanged=true;draw()}};
$('resetMat').onclick=()=>{if(!locked){resetMaterial();feedback.textContent=''}};
$('checkMat').onclick=()=>finish(tens*10+ones);
$('checkMaterialNumber').onclick=()=>{const v=$('materialNumber').value.trim();if(!v){showFeedback('Bitte die neue Zahl eingeben.');return}const n=Number(v);if(!Number.isInteger(n)||n<1||n>100){showFeedback('✗');return}finish(n)};
$('materialNumber').addEventListener('keydown',e=>{if(e.key==='Enter')$('checkMaterialNumber').click()});
$('check').onclick=checkInput;answerInput.addEventListener('keydown',e=>{if(e.key==='Enter')checkInput()});
$('new').onclick=make;
document.querySelectorAll('.settings button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.settings button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;make()});
document.querySelectorAll('.answerMode button').forEach(b=>b.onclick=()=>setAnswerMode(b.dataset.answer));
setAnswerMode('material');
})();
</script></body></html>
